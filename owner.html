<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkTrack Owner - Control Center</title>
    <link rel="manifest" href="manifest-owner.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" href="icon-owner.png">
    <link rel="apple-touch-icon" href="icon-owner.png">
    <script>
        window.FORCED_APP_MODE = 'owner';
        localStorage.setItem('wt_locked_app', 'owner');
    </script>
</head>
<body style="margin:0;padding:0;background:#0f172a;">
    <iframe id="owner-frame" src="about:blank" style="border:none;width:100vw;height:100vh;display:block;"></iframe>
    <script>
        (function() {
            const p = new URLSearchParams(window.location.search);
            const secretKey = p.get('key');
            const ua = navigator.userAgent || '';
            const isMobileAndroid = /Android/i.test(ua);
            const isDesktopOS = /Windows NT|Macintosh|X11|CrOS/i.test(ua) && !isMobileAndroid;
            const isWideDesktopScreen = window.innerWidth > 900 && !('ontouchstart' in window);

            const basePage = (window.location.pathname.includes('owner.html') && window.location.hostname === '')
                ? 'worktrack_mvp.html'
                : 'index.html';

            if (secretKey === 'WT9988') {
                document.getElementById('owner-frame').src = `${basePage}?app=owner&key=WT9988`;
            } else if (isMobileAndroid && !isDesktopOS && !isWideDesktopScreen) {
                document.getElementById('owner-frame').src = `${basePage}?app=owner&key=WT9988`;
            } else {
                // Laptop/Desktop browser without secret key -> block access immediately
                document.getElementById('owner-frame').src = `${basePage}?app=owner&blocked=1`;
            }
        })();
    </script>
</body>
</html>
